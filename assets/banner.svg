<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 440" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0d17" />
      <stop offset="45%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#070a13" />
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="cyan-purple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>

    <linearGradient id="emerald-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <linearGradient id="card-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>

    <!-- Radial Glows -->
    <radialGradient id="glow-cyan" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="glow-purple" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0" />
    </radialGradient>

    <!-- Filters -->
    <filter id="blur-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.75" stroke-opacity="0.35" />
      <circle cx="40" cy="40" r="1.5" fill="#38bdf8" fill-opacity="0.25" />
    </pattern>

    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1280" height="440" fill="url(#bg-grad)" />

  <!-- Ambient Glow Blobs -->
  <circle cx="220" cy="100" r="240" fill="url(#glow-cyan)" />
  <circle cx="1060" cy="340" r="260" fill="url(#glow-purple)" />
  <circle cx="640" cy="220" r="300" fill="url(#glow-cyan)" opacity="0.4" />

  <!-- Grid Overlay -->
  <rect width="1280" height="440" fill="url(#grid)" />

  <!-- Top Decorative Border Beam -->
  <rect x="0" y="0" width="1280" height="3" fill="url(#cyan-purple)" />

  <!-- ================= DYNAMIC BACKGROUND ARCHITECTURE FLOW ================= -->
  <g opacity="0.65">
    <!-- Connecting Stream Pipelines -->
    <path id="pipeline1" d="M 120 330 C 260 330, 280 370, 420 370 C 560 370, 580 330, 720 330 C 860 330, 880 370, 1020 370 C 1100 370, 1140 340, 1200 340"
          fill="none" stroke="#1e293b" stroke-width="6" stroke-linecap="round" />

    <path d="M 120 330 C 260 330, 280 370, 420 370 C 560 370, 580 330, 720 330 C 860 330, 880 370, 1020 370 C 1100 370, 1140 340, 1200 340"
          fill="none" stroke="url(#cyan-purple)" stroke-width="2.5" stroke-dasharray="8 12" stroke-linecap="round">
      <animate attributeName="stroke-dashoffset" from="200" to="0" dur="5s" repeatCount="indefinite" />
    </path>

    <!-- Animated Data Stream Packets -->
    <circle r="5" fill="#38bdf8" filter="url(#blur-glow)">
      <animateMotion dur="4s" repeatCount="indefinite" path="M 120 330 C 260 330, 280 370, 420 370 C 560 370, 580 330, 720 330 C 860 330, 880 370, 1020 370 C 1100 370, 1140 340, 1200 340" />
    </circle>
    <circle r="4" fill="#a855f7" filter="url(#blur-glow)">
      <animateMotion dur="4s" begin="1.5s" repeatCount="indefinite" path="M 120 330 C 260 330, 280 370, 420 370 C 560 370, 580 330, 720 330 C 860 330, 880 370, 1020 370 C 1100 370, 1140 340, 1200 340" />
    </circle>
    <circle r="4" fill="#34d399" filter="url(#blur-glow)">
      <animateMotion dur="4s" begin="3s" repeatCount="indefinite" path="M 120 330 C 260 330, 280 370, 420 370 C 560 370, 580 330, 720 330 C 860 330, 880 370, 1020 370 C 1100 370, 1140 340, 1200 340" />
    </circle>

    <!-- Step 1 Node: Ingestion -->
    <g transform="translate(120, 330)">
      <circle r="22" fill="#0f172a" stroke="#06b6d4" stroke-width="2" />
      <circle r="28" fill="none" stroke="#06b6d4" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.7">
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="10s" repeatCount="indefinite" />
      </circle>
      <text x="0" y="5" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#38bdf8" text-anchor="middle" font-weight="700">IN</text>
      <text x="0" y="44" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle" font-weight="600">Event Stream</text>
    </g>

    <!-- Step 2 Node: Warehouse/Lake -->
    <g transform="translate(420, 370)">
      <circle r="22" fill="#0f172a" stroke="#3b82f6" stroke-width="2" />
      <circle r="28" fill="none" stroke="#3b82f6" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.7">
        <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="12s" repeatCount="indefinite" />
      </circle>
      <text x="0" y="5" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#60a5fa" text-anchor="middle" font-weight="700">DWH</text>
      <text x="0" y="44" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle" font-weight="600">Data Lake</text>
    </g>

    <!-- Step 3 Node: Unified Profile / CDP -->
    <g transform="translate(720, 330)">
      <circle r="26" fill="#0f172a" stroke="#8b5cf6" stroke-width="2.5" />
      <circle r="34" fill="none" stroke="#a855f7" stroke-width="1.5" opacity="0.8">
        <animate attributeName="r" values="30;37;30" dur="3s" repeatCount="indefinite" />
        <animate attributeName="opacity" values="0.8;0.2;0.8" dur="3s" repeatCount="indefinite" />
      </circle>
      <text x="0" y="5" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#c084fc" text-anchor="middle" font-weight="800">CDP</text>
      <text x="0" y="48" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#c084fc" text-anchor="middle" font-weight="600">Identity 360°</text>
    </g>

    <!-- Step 4 Node: Reverse ETL -->
    <g transform="translate(1020, 370)">
      <circle r="22" fill="#0f172a" stroke="#ec4899" stroke-width="2" />
      <circle r="28" fill="none" stroke="#ec4899" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.7">
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="10s" repeatCount="indefinite" />
      </circle>
      <text x="0" y="5" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#f472b6" text-anchor="middle" font-weight="700">rETL</text>
      <text x="0" y="44" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle" font-weight="600">Reverse ETL</text>
    </g>

    <!-- Step 5 Node: Real-time Activation -->
    <g transform="translate(1200, 340)">
      <circle r="20" fill="#0f172a" stroke="#10b981" stroke-width="2" />
      <text x="0" y="5" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#34d399" text-anchor="middle" font-weight="700">ACT</text>
      <text x="0" y="44" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle" font-weight="600">Activation</text>
    </g>
  </g>

  <!-- ================= FOREGROUND HERO CONTENT (Guaranteed Clear & Front) ================= -->

  <!-- Floating Category Badges / Architecture Pills -->
  <g transform="translate(640, 60)" text-anchor="middle">
    <!-- Center top badge -->
    <rect x="-170" y="0" width="340" height="28" rx="14" fill="#1e293b" stroke="#38bdf8" stroke-width="1" opacity="0.95" />
    <circle cx="-148" cy="14" r="4" fill="#38bdf8">
      <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="8" y="18" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11.5" fill="#e2e8f0" font-weight="600" letter-spacing="1">
      REAL-TIME DATA INFRASTRUCTURE &amp; CDP
    </text>
  </g>

  <!-- Main Hero Titles -->
  <g transform="translate(640, 135)" text-anchor="middle" filter="url(#shadow)">
    <!-- Main Title -->
    <text x="0" y="0" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="900" fill="#ffffff" letter-spacing="-0.5">
      Awesome Real-Time Customer Data Platform
    </text>

    <!-- Gradient Highlight for Sub-Word -->
    <text x="0" y="42" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="800" fill="url(#cyan-purple)" letter-spacing="0.5">
      Enterprise SaaS &amp; Open-Source CDP Ecosystem
    </text>

    <!-- Subtitle -->
    <text x="0" y="80" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="400" fill="#94a3b8" letter-spacing="0.3">
      Curated guide to warehouse-native customer 360°, real-time event streaming, identity resolution &amp; reverse ETL
    </text>
  </g>

  <!-- Interactive Floating Tags Bar -->
  <g transform="translate(640, 245)" text-anchor="middle">
    <!-- Tag 1: Event Collection -->
    <g transform="translate(-360, 0)">
      <rect x="-85" y="-14" width="170" height="28" rx="14" fill="#0f172a" stroke="#06b6d4" stroke-width="1.2" />
      <text x="0" y="4" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#38bdf8" font-weight="600">⚡ Real-Time Ingestion</text>
    </g>

    <!-- Tag 2: Composable CDP -->
    <g transform="translate(-180, 0)">
      <rect x="-85" y="-14" width="170" height="28" rx="14" fill="#0f172a" stroke="#3b82f6" stroke-width="1.2" />
      <text x="0" y="4" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#60a5fa" font-weight="600">🏛️ Warehouse-Native</text>
    </g>

    <!-- Tag 3: Identity Stitching -->
    <g transform="translate(0, 0)">
      <rect x="-85" y="-14" width="170" height="28" rx="14" fill="#0f172a" stroke="#8b5cf6" stroke-width="1.2" />
      <text x="0" y="4" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#c084fc" font-weight="600">🧩 Identity Resolution</text>
    </g>

    <!-- Tag 4: Reverse ETL -->
    <g transform="translate(180, 0)">
      <rect x="-85" y="-14" width="170" height="28" rx="14" fill="#0f172a" stroke="#ec4899" stroke-width="1.2" />
      <text x="0" y="4" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#f472b6" font-weight="600">🔄 Reverse ETL Sync</text>
    </g>

    <!-- Tag 5: Open Source -->
    <g transform="translate(360, 0)">
      <rect x="-85" y="-14" width="170" height="28" rx="14" fill="#0f172a" stroke="#10b981" stroke-width="1.2" />
      <text x="0" y="4" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#34d399" font-weight="600">🔓 100% Data Ownership</text>
    </g>
  </g>
</svg>
